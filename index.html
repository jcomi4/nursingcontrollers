<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KSU Nursing VR Orientation</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #launch-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, #002664 0%, #001233 100%);
        color: #FFFFFF; display: flex; flex-direction: column;
        justify-content: center; align-items: center; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer; z-index: 9999;
      }
      .badge {
        background: #EEB111; color: #002664; font-weight: 800;
        padding: 8px 22px; border-radius: 24px; font-size: 1.15rem; letter-spacing: 1.5px;
      }
      h1 { font-size: 2.5rem; margin: 1.2rem 0 0.4rem; font-weight: 700; text-align: center; }
      p { font-size: 1.2rem; color: #D8E2DC; margin: 0 0 2rem; }
      .click-box {
        padding: 1.2rem 3rem; background: rgba(238, 177, 17, 0.15);
        border: 2px solid #EEB111; border-radius: 12px; font-size: 1.5rem; font-weight: 700;
        color: #EEB111; transition: transform 0.15s ease;
      }
      .click-box:hover {
        background: rgba(238, 177, 17, 0.3);
        transform: scale(1.03);
      }
    </style>

    <script>
      AFRAME.registerComponent('step-manager', {
        init: function () {
          // Flow: 1 -> 2 -> '2.5' -> 3 -> 4
          this.step = 1;
          this.gripTimer = 0;
          this.isGripping = false;
          this.targetsRemaining = 3;
          this.teleportState = 'away';

          this.slideDisplay = document.querySelector('#slideDisplay');
          this.progressBar = document.querySelector('#progress-fill');
          this.progressBg = document.querySelector('#progress-bg');
          this.targetGroup = document.querySelector('#target-group');
          this.teleportZone = document.querySelector('#teleport-zone');
          this.teleportArc = document.querySelector('#teleport-arc');
          this.cameraRig = document.querySelector('#camera-rig');
          this.leftHand = document.querySelector('#left-hand');
          this.rightHand = document.querySelector('#right-hand');

          // Texture Loader preserves original slide names + slide2_5.png
          const loader = new THREE.TextureLoader();
          this.loadedTextures = {
            1: loader.load('slide1.png'),
            2: loader.load('slide2.png'),
            '2.5': loader.load('slide2_5.png'),
            3: loader.load('slide3.png'),
            4: loader.load('slide4.png')
          };

          if (this.slideDisplay.hasLoaded) {
            this.applyTexture(1);
          } else {
            this.slideDisplay.addEventListener('loaded', () => this.applyTexture(1));
          }

          this.updateStep();
          this.bindControls();
        },

        applyTexture: function (stepKey) {
          const mesh = this.slideDisplay.getObject3D('mesh');
          if (mesh && mesh.material) {
            mesh.material.map = this.loadedTextures[stepKey];
            mesh.material.needsUpdate = true;
          }
        },

        updateStep: function () {
          this.applyTexture(this.step);

          if (this.step === 1) {
            this.progressBg.setAttribute('visible', 'true');
            this.progressBar.setAttribute('visible', 'true');
            this.progressBar.setAttribute('scale', '0 1 1');
          } 
          else if (this.step === 2) {
            this.progressBg.setAttribute('visible', 'false');
            this.progressBar.setAttribute('visible', 'false');
            this.targetGroup.setAttribute('visible', 'true');

            // Activate pointing lasers for 360 targets
            this.leftHand.setAttribute('raycaster', 'objects: .clickable; showLine: true; far: 25');
            this.rightHand.setAttribute('raycaster', 'objects: .clickable; showLine: true; far: 25');
            this.leftHand.setAttribute('cursor', 'rayOrigin: entity');
            this.rightHand.setAttribute('cursor', 'rayOrigin: entity');
          } 
          else if (this.step === '2.5') {
            // Teleportation stage
            this.targetGroup.setAttribute('visible', 'false');
            this.teleportZone.setAttribute('visible', 'true');
            this.teleportZone.setAttribute('position', '2.5 0.03 -1.5');
            this.teleportState = 'away';

            // Disable pointer cursors during thumbstick teleport mode
            this.leftHand.removeAttribute('cursor');
            this.rightHand.removeAttribute('cursor');
            this.leftHand.setAttribute('raycaster', 'showLine', false);
            this.rightHand.setAttribute('raycaster', 'showLine', false);
          } 
          else if (this.step === 3) {
            // Meta Button stage
            this.teleportZone.setAttribute('visible', 'false');
            this.teleportArc.setAttribute('visible', 'false');
          } 
          else if (this.step === 4) {
            // Done
            setTimeout(() => {
              const scene = this.el.sceneEl;
              if (scene.is('vr-mode')) scene.exitVR();
            }, 5000);
          }
        },

        bindControls: function () {
          const checkGrip = (val) => {
            this.isGripping = val;
            if (!val && this.step === 1) {
              this.gripTimer = 0;
              this.progressBar.setAttribute('scale', '0 1 1');
            }
          };

          ['#left-hand', '#right-hand'].forEach(selector => {
            const hand = document.querySelector(selector);
            hand.addEventListener('gripdown', () => checkGrip(true));
            hand.addEventListener('gripup', () => checkGrip(false));

            // Pull pointer trigger in Step 3 advances to Step 4
            hand.addEventListener('triggerdown', () => {
              if (this.step === 3) {
                this.step = 4;
                this.updateStep();
              }
            });

            // Thumbstick interaction (Step 2.5)
            hand.addEventListener('axismove', (e) => {
              if (this.step !== '2.5') return;
              const yAxis = e.detail.axis[3] !== undefined ? e.detail.axis[3] : e.detail.axis[1];

              if (yAxis < -0.6) {
                this.isAimingTeleport = true;
                this.activeTeleportHand = hand;
                this.teleportArc.setAttribute('visible', 'true');
              } else if (this.isAimingTeleport && yAxis > -0.2) {
                this.executeTeleport();
              }
            });
          });
        },

        executeTeleport: function () {
          this.isAimingTeleport = false;
          this.teleportArc.setAttribute('visible', 'false');

          if (!this.validLandingPos) return;

          const padPos = this.teleportZone.getAttribute('position');
          const dist = Math.hypot(this.validLandingPos.x - padPos.x, this.validLandingPos.z - padPos.z);

          // Close enough to landing zone
          if (dist < 1.0) {
            this.cameraRig.setAttribute('position', `${padPos.x} 0 ${padPos.z}`);

            if (this.teleportState === 'away') {
              this.teleportState = 'home';
              // Move target back to station center
              this.teleportZone.setAttribute('position', '0 0.03 -0.6');
            } else if (this.teleportState === 'home') {
              this.step = 3;
              this.updateStep();
            }
          }
        },

        tick: function (time, deltaTime) {
          // Bottom-Left Hold Progress Bar (Step 1)
          if (this.step === 1 && this.isGripping) {
            this.gripTimer += deltaTime;
            const progress = Math.min(this.gripTimer / 2000, 1);
            this.progressBar.setAttribute('scale', `${progress} 1 1`);
            this.progressBar.setAttribute('position', `${-1.85 + (progress * 0.75)} -1.02 0.04`);

            if (this.gripTimer >= 2000) {
              this.isGripping = false;
              this.step = 2;
              this.updateStep();
            }
          }

          // Teleport floor line renderer (Step 2.5)
          if (this.step === '2.5' && this.isAimingTeleport && this.activeTeleportHand) {
            const handObj = this.activeTeleportHand.object3D;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(handObj.quaternion);
            const handPos = new THREE.Vector3();
            handObj.getWorldPosition(handPos);

            if (forward.y < -0.1) {
              const t = -handPos.y / forward.y;
              const hitX = handPos.x + forward.x * t;
              const hitZ = handPos.z + forward.z * t;
              this.validLandingPos = { x: hitX, z: hitZ };

              this.teleportArc.setAttribute('line', {
                start: `${handPos.x} ${handPos.y} ${handPos.z}`,
                end: `${hitX} 0.02 ${hitZ}`,
                color: '#EEB111'
              });
            }
          }
        },

        targetHit: function () {
          this.targetsRemaining--;
          if (this.targetsRemaining <= 0) {
            this.step = '2.5';
            this.updateStep();
          }
        }
      });

      AFRAME.registerComponent('shootable', {
        init: function () {
          this.el.addEventListener('click', () => {
            this.el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 150');
            setTimeout(() => {
              const mgr = document.querySelector('a-scene').components['step-manager'];
              if (mgr) mgr.targetHit();
              this.el.parentNode.removeChild(this.el);
            }, 150);
          });
        }
      });

      function startLabExperience() {
        const overlay = document.querySelector('#launch-screen');
        if (overlay) overlay.style.display = 'none';
        document.querySelector('a-scene').enterVR();
      }
    </script>
  </head>
  <body>
    <div id="launch-screen" onclick="startLabExperience()">
      <div class="badge">KENT STATE UNIVERSITY</div>
      <h1>College of Nursing VR Lab</h1>
      <p>Controller Onboarding & Readiness Check (1.09)</p>
      <div class="click-box">Push Any Button or Tap Screen to Begin</div>
    </div>

    <a-scene step-manager background="color: #001233">
      <a-light type="ambient" color="#FFF" intensity="1.0"></a-light>
      <a-light type="directional" position="0 6 -2" color="#FFF" intensity="0.6"></a-light>

      <!-- Floor & Station Indicator -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="16" height="16" color="#060E1A"></a-plane>
      <a-plane position="0 0.02 -0.6" rotation="-90 0 0" width="1.4" height="1.4" color="#0056B3" opacity="0.9"></a-plane>
      <a-ring position="0 0.03 -0.6" rotation="-90 0 0" radius-inner="0.65" radius-outer="0.7" color="#EEB111"></a-ring>
      <a-text value="STATION CENTER" position="0 0.04 -0.6" rotation="-90 0 0" align="center" width="2.4" color="#FFFFFF" font="roboto"></a-text>

      <!-- Camera Rig -->
      <a-entity id="camera-rig" position="0 0 0">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity id="left-hand" oculus-touch-controls="hand: left; model: true" laser-controls="hand: left" raycaster="lineColor: #EEB111; lineOpacity: 0.9"></a-entity>
        <a-entity id="right-hand" oculus-touch-controls="hand: right; model: true" laser-controls="hand: right" raycaster="lineColor: #EEB111; lineOpacity: 0.9"></a-entity>
      </a-entity>

      <!-- Teleport Line & Indicator -->
      <a-entity id="teleport-arc" visible="false" line="color: #EEB111; opacity: 0.8"></a-entity>
      <a-entity id="teleport-zone" visible="false" position="2.5 0.03 -1.5">
        <a-ring rotation="-90 0 0" radius-inner="0.5" radius-outer="0.6" color="#00FFCC" animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 800"></a-ring>
        <a-circle rotation="-90 0 0" radius="0.5" color="#002664" opacity="0.6"></a-circle>
        <a-text value="TELEPORT HERE" rotation="-90 0 0" position="0 0.01 0" align="center" width="2.6" color="#00FFCC" font="roboto"></a-text>
      </a-entity>

      <!-- Display Board -->
      <a-entity position="0 1.65 -3.5">
        <a-plane width="4.3" height="2.46" position="0 0 -0.01" color="#EEB111"></a-plane>
        <a-plane id="slideDisplay" position="0 0 0.01" width="4.26" height="2.4" material="shader: flat; color: #FFFFFF"></a-plane>

        <!-- Hold Bar -->
        <a-plane id="progress-bg" position="-1.1 -1.02 0.03" width="1.5" height="0.07" color="#00183F" visible="true"></a-plane>
        <a-plane id="progress-fill" position="-1.85 -1.02 0.04" scale="0 1 1" width="1.5" height="0.07" color="#EEB111" visible="true"></a-plane>
      </a-entity>

      <!-- 360 Targets -->
      <a-entity id="target-group" visible="false">
        <a-sphere class="clickable" shootable position="-3.0 1.6 0.0" radius="0.25" color="#EEB111" animation="property: position; to: -3.0 1.75 0.0; dir: alternate; loop: true; dur: 1200"></a-sphere>
        <a-sphere class="clickable" shootable position="3.0 1.6 0.0" radius="0.25" color="#EEB111" animation="property: position; to: 3.0 1.75 0.0; dir: alternate; loop: true; dur: 1400"></a-sphere>
        <a-sphere class="clickable" shootable position="0.0 1.7 2.8" radius="0.25" color="#EEB111" animation="property: position; to: 0.0 1.85 2.8; dir: alternate; loop: true; dur: 1000"></a-sphere>
      </a-entity>
    </a-scene>
  </body>
</html>
