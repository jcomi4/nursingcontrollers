<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KSU Nursing VR Orientation</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #launch-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle, #002664 0%, #001233 100%);
        color: #FFFFFF; display: flex; flex-direction: column;
        justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer; z-index: 9999;
      }
      .ksu-gold { color: #EEB111; }
      .badge {
        background: #EEB111; color: #002664; font-weight: 800;
        padding: 6px 18px; border-radius: 20px; font-size: 1.1rem; letter-spacing: 1px;
      }
      .click-box {
        margin-top: 2.5rem; padding: 1.2rem 2.8rem; background: rgba(238, 177, 17, 0.15);
        border: 2px solid #EEB111; border-radius: 8px; font-size: 1.5rem; font-weight: 700;
      }
    </style>

    <script>
      AFRAME.registerComponent('step-manager', {
        init: function () {
          this.step = 1; // 1: Grip, 2: Trigger/Targets, 3: Menu, 4: Done
          this.gripTimer = 0;
          this.isGripping = false;
          this.targetsRemaining = 3;

          this.stepTitle = document.querySelector('#step-title');
          this.stepInstruction = document.querySelector('#step-instruction');
          this.stepSub = document.querySelector('#step-sub');
          this.controllerImg = document.querySelector('#controller-img');
          this.progressBar = document.querySelector('#progress-fill');
          this.targetGroup = document.querySelector('#target-group');
          this.leftHand = document.querySelector('#left-hand');
          this.rightHand = document.querySelector('#right-hand');

          // Photo references for each button
          this.images = {
            grip: 'https://marketing.visiofy.com/hs-fs/hubfs/Tutorial%20pictures/Meta_quest_controllers.jpg?width=1200&height=627&name=Meta_quest_controllers.jpg',
            trigger: 'https://marketing.visiofy.com/hs-fs/hubfs/Tutorial%20pictures/Meta_quest_controllers.jpg?width=1200&height=627&name=Meta_quest_controllers.jpg',
            menu: 'https://marketing.visiofy.com/hs-fs/hubfs/Tutorial%20pictures/Meta_quest_controllers.jpg?width=1200&height=627&name=Meta_quest_controllers.jpg'
          };

          this.updateStepUI();
          this.bindControls();
        },

        updateStepUI: function () {
          if (this.step === 1) {
            this.stepTitle.setAttribute('value', 'STEP 1: GRIP TRIGGER');
            this.stepInstruction.setAttribute('value', 'Squeeze & hold the SIDE button with your middle finger.');
            this.stepSub.setAttribute('value', 'Hold for 2 seconds...');
            this.stepSub.setAttribute('color', '#EEB111');
            this.controllerImg.setAttribute('src', this.images.grip);
          } 
          else if (this.step === 2) {
            this.stepTitle.setAttribute('value', 'STEP 2: POINT & CLICK');
            this.stepInstruction.setAttribute('value', 'Aim your laser and pull the FRONT trigger on the 3 targets.');
            this.stepSub.setAttribute('value', 'Targets Remaining: 3');
            this.stepSub.setAttribute('color', '#00FFCC');
            this.progressBar.setAttribute('visible', 'false');
            document.querySelector('#progress-bg').setAttribute('visible', 'false');
            this.targetGroup.setAttribute('visible', 'true');

            // Turn on active pointing lasers
            this.leftHand.setAttribute('raycaster', 'objects: .clickable; showLine: true; far: 20');
            this.rightHand.setAttribute('raycaster', 'objects: .clickable; showLine: true; far: 20');
            this.leftHand.setAttribute('cursor', 'rayOrigin: entity');
            this.rightHand.setAttribute('cursor', 'rayOrigin: entity');
          } 
          else if (this.step === 3) {
            this.stepTitle.setAttribute('value', 'STEP 3: MENU BUTTON');
            this.stepInstruction.setAttribute('value', 'Press the flat MENU button on your left controller with your thumb.');
            this.stepSub.setAttribute('value', 'Press once to finish');
            this.stepSub.setAttribute('color', '#EEB111');
            this.targetGroup.setAttribute('visible', 'false');
          } 
          else if (this.step === 4) {
            this.stepTitle.setAttribute('value', 'READY FOR SIMULATION');
            this.stepInstruction.setAttribute('value', 'Closing tutorial...\nPlease select INTELECT from your menu.');
            this.stepSub.setAttribute('value', 'Done!');
            this.stepSub.setAttribute('color', '#00FFCC');
            this.controllerImg.setAttribute('visible', 'false');

            setTimeout(() => {
              const scene = this.el.sceneEl;
              if (scene.is('vr-mode')) scene.exitVR();
            }, 2500);
          }
        },

        bindControls: function () {
          const checkGrip = (val) => {
            this.isGripping = val;
            if (!val && this.step === 1) {
              this.gripTimer = 0;
              this.progressBar.setAttribute('scale', '0 1 1');
            }
          };

          ['#left-hand', '#right-hand'].forEach(selector => {
            const hand = document.querySelector(selector);
            hand.addEventListener('gripdown', () => checkGrip(true));
            hand.addEventListener('gripup', () => checkGrip(false));

            const handleThumb = () => {
              if (this.step === 3) {
                this.step = 4;
                this.updateStepUI();
              }
            };
            hand.addEventListener('xbuttondown', handleThumb);
            hand.addEventListener('abuttondown', handleThumb);
          });
        },

        tick: function (time, deltaTime) {
          if (this.step === 1 && this.isGripping) {
            this.gripTimer += deltaTime;
            const progress = Math.min(this.gripTimer / 2000, 1);
            this.progressBar.setAttribute('scale', `${progress} 1 1`);
            this.progressBar.setAttribute('position', `${-0.7 + (progress * 0.7)} -0.55 0.03`);

            if (this.gripTimer >= 2000) {
              this.isGripping = false;
              this.step = 2;
              this.updateStepUI();
            }
          }
        },

        targetHit: function () {
          this.targetsRemaining--;
          this.stepSub.setAttribute('value', `Targets Remaining: ${this.targetsRemaining}`);
          if (this.targetsRemaining <= 0) {
            this.step = 3;
            this.updateStepUI();
          }
        }
      });

      AFRAME.registerComponent('shootable', {
        init: function () {
          this.el.addEventListener('click', () => {
            this.el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 150');
            setTimeout(() => {
              const mgr = document.querySelector('a-scene').components['step-manager'];
              if (mgr) mgr.targetHit();
              this.el.parentNode.removeChild(this.el);
            }, 150);
          });
        }
      });

      function startLabExperience() {
        document.querySelector('#launch-screen').style.display = 'none';
        document.querySelector('a-scene').enterVR();
      }
    </script>
  </head>
  <body>
    <!-- 2D Initial Tap Shield -->
    <div id="launch-screen" onclick="startLabExperience()">
      <div class="badge">KENT STATE NURSING</div>
      <h1 style="font-size: 2.5rem; margin-top: 1rem;">VR Controller Check</h1>
      <div class="click-box">Pull Front Trigger to Begin</div>
    </div>

    <!-- 3D Scene -->
    <a-scene step-manager background="color: #001233">
      <!-- Lighting -->
      <a-light type="ambient" color="#FFF" intensity="0.6"></a-light>
      <a-light type="directional" position="0 4 -2" color="#FFF" intensity="0.8"></a-light>

      <!-- Controllers with Built-in Lasers -->
      <a-entity id="left-hand" oculus-touch-controls="hand: left; model: true" laser-controls="hand: left" raycaster="lineColor: #EEB111; lineOpacity: 0.9"></a-entity>
      <a-entity id="right-hand" oculus-touch-controls="hand: right; model: true" laser-controls="hand: right" raycaster="lineColor: #EEB111; lineOpacity: 0.9"></a-entity>

      <!-- Main Instruction Board -->
      <a-entity position="0 1.6 -2.4">
        <a-plane width="3.4" height="2.0" color="#002664" opacity="0.95"></a-plane>
        <a-plane width="3.44" height="2.04" position="0 0 -0.01" color="#EEB111"></a-plane>

        <a-text value="KENT STATE UNIVERSITY" align="center" position="0 0.82 0.02" width="4.5" color="#EEB111" font="roboto"></a-text>
        <a-text id="step-title" value="STEP 1: GRIP TRIGGER" align="center" position="0 0.58 0.02" width="4.2" color="#FFFFFF" font="roboto"></a-text>

        <!-- 1-line clear instruction -->
        <a-text id="step-instruction" value="" align="center" position="0 0.32 0.02" width="3.5" color="#E0E0E0" font="roboto"></a-text>

        <!-- Controller Photo Reference -->
        <a-image id="controller-img" position="0 -0.08 0.02" width="1.6" height="0.85"></a-image>

        <!-- Action / Count Prompt -->
        <a-text id="step-sub" value="" align="center" position="0 -0.65 0.02" width="3.8" color="#EEB111" font="roboto"></a-text>

        <!-- Progress Bar for Step 1 -->
        <a-plane id="progress-bg" position="0 -0.55 0.02" width="1.4" height="0.06" color="#00183f"></a-plane>
        <a-plane id="progress-fill" position="-0.7 -0.55 0.03" scale="0 1 1" width="1.4" height="0.06" color="#EEB111"></a-plane>
      </a-entity>

      <!-- Step 2 Clickable Golden Targets -->
      <a-entity id="target-group" visible="false">
        <a-sphere class="clickable" shootable position="-1.5 1.6 -2.0" radius="0.22" color="#EEB111" animation="property: position; to: -1.5 1.7 -2.0; dir: alternate; loop: true; dur: 1200"></a-sphere>
        <a-sphere class="clickable" shootable position="0 2.2 -1.8" radius="0.22" color="#EEB111" animation="property: position; to: 0 2.3 -1.8; dir: alternate; loop: true; dur: 1000"></a-sphere>
        <a-sphere class="clickable" shootable position="1.5 1.5 -2.0" radius="0.22" color="#EEB111" animation="property: position; to: 1.5 1.6 -2.0; dir: alternate; loop: true; dur: 1400"></a-sphere>
      </a-entity>
    </a-scene>
  </body>
</html>
