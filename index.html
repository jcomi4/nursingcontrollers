<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>KSU Nursing VR Orientation</title>
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #launch-screen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at center, #002664 0%, #001233 100%);
        color: #FFFFFF; display: flex; flex-direction: column;
        justify-content: center; align-items: center; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer; z-index: 9999;
      }
      .badge {
        background: #EEB111; color: #002664; font-weight: 800;
        padding: 8px 22px; border-radius: 24px; font-size: 1.15rem; letter-spacing: 1.5px;
      }
      h1 { font-size: 2.5rem; margin: 1.2rem 0 0.4rem; font-weight: 700; text-align: center; }
      p { font-size: 1.2rem; color: #D8E2DC; margin: 0 0 2rem; }
      .click-box {
        padding: 1.2rem 3rem; background: rgba(238, 177, 17, 0.15);
        border: 2px solid #EEB111; border-radius: 12px; font-size: 1.5rem; font-weight: 700;
        color: #EEB111; transition: transform 0.15s ease;
      }
      .click-box:hover {
        background: rgba(238, 177, 17, 0.3);
        transform: scale(1.03);
      }
    </style>

    <script>
      // Sound Synthesizer via Web Audio API (Zero External Files Needed)
      const SoundFX = {
        ctx: null,
        init: function () {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        },
        playTargetHit: function () {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, this.ctx.currentTime); // A5 note
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.18);
        },
        playStepComplete: function () {
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          
          // Two-tone rising success chime
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now); // D5
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.2);

          const osc2 = this.ctx.createOscillator();
          const gain2 = this.ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.12); // A5
          gain2.gain.setValueAtTime(0.25, now + 0.12);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc2.connect(gain2);
          gain2.connect(this.ctx.destination);
          osc2.start(now + 0.12);
          osc2.stop(now + 0.45);
        }
      };

      AFRAME.registerComponent('step-manager', {
        init: function () {
          this.step = 1;
          this.targetsRemaining = 3;
          this.teleportState = 'away';
          this.isStickActive = false;

          // Key and Lock State (Step 1)
          this.keySolved = false;
          this.grabbedHand = null;
          this.keyDefaultPos = new THREE.Vector3(-0.35, 1.05, -0.7);

          // Dual trigger tracking for Step 3
          this.leftTriggerDown = false;
          this.rightTriggerDown = false;

          this.slideDisplay = document.querySelector('#slideDisplay');
          this.targetGroup = document.querySelector('#target-group');
          this.keyLockGroup = document.querySelector('#key-lock-group');
          this.keyEntity = document.querySelector('#key-entity');
          this.lockEntity = document.querySelector('#lock-entity');

          this.teleportZone = document.querySelector('#teleport-zone');
          this.teleportMarker = document.querySelector('#teleport-marker');
          this.teleportBeam = document.querySelector('#teleport-beam');
          this.cameraRig = document.querySelector('#camera-rig');
          this.leftHand = document.querySelector('#left-hand');
          this.rightHand = document.querySelector('#right-hand');

          // Texture Loader
          const loader = new THREE.TextureLoader();
          this.loadedTextures = {
            1: loader.load('slide1.png'),
            2: loader.load('slide2.png'),
            '2.5': loader.load('slide2_5.png'),
            3: loader.load('slide3.png'),
            4: loader.load('slide4.png')
          };

          if (this.slideDisplay.hasLoaded) {
            this.applyTexture(1);
          } else {
            this.slideDisplay.addEventListener('loaded', () => this.applyTexture(1));
          }

          this.updateStep(false);
          this.bindControls();
        },

        applyTexture: function (stepKey) {
          const mesh = this.slideDisplay.getObject3D('mesh');
          if (mesh && mesh.material) {
            mesh.material.map = this.loadedTextures[stepKey];
            mesh.material.needsUpdate = true;
          }
        },

        updateStep: function (playChime = true) {
          if (playChime) SoundFX.playStepComplete();
          this.applyTexture(this.step);

          if (this.step === 1) {
            this.keyLockGroup.setAttribute('visible', 'true');
          } 
          else if (this.step === 2) {
            this.keyLockGroup.setAttribute('visible', 'false');
            this.targetGroup.setAttribute('visible', 'true');

            this.leftHand.setAttribute('raycaster', 'objects: .clickable; showLine: true; far: 25');
            this.rightHand.setAttribute('raycaster', 'objects: .clickable; showLine: true; far: 25');
            this.leftHand.setAttribute('cursor', 'rayOrigin: entity');
            this.rightHand.setAttribute('cursor', 'rayOrigin: entity');
          } 
          else if (this.step === '2.5') {
            this.targetGroup.setAttribute('visible', 'false');
            this.teleportZone.setAttribute('visible', 'true');
            this.teleportZone.setAttribute('position', '2.5 0.03 -1.5');
            this.teleportState = 'away';

            this.leftHand.removeAttribute('cursor');
            this.rightHand.removeAttribute('cursor');
            this.leftHand.setAttribute('raycaster', 'showLine', false);
            this.rightHand.setAttribute('raycaster', 'showLine', false);
          } 
          else if (this.step === 3) {
            this.teleportZone.setAttribute('visible', 'false');
            this.teleportMarker.setAttribute('visible', 'false');
            this.teleportBeam.setAttribute('visible', 'false');
            this.leftTriggerDown = false;
            this.rightTriggerDown = false;
          } 
          else if (this.step === 4) {
            setTimeout(() => {
              const scene = this.el.sceneEl;
              if (scene.is('vr-mode')) scene.exitVR();
            }, 5000);
          }
        },

        bindControls: function () {
          // Left Hand Listeners
          this.leftHand.addEventListener('gripdown', () => this.tryGrabKey(this.leftHand));
          this.leftHand.addEventListener('gripup', () => this.tryReleaseKey(this.leftHand));
          this.leftHand.addEventListener('triggerdown', () => {
            this.leftTriggerDown = true;
            this.checkDualTriggers();
          });
          this.leftHand.addEventListener('triggerup', () => {
            this.leftTriggerDown = false;
          });

          // Right Hand Listeners
          this.rightHand.addEventListener('gripdown', () => this.tryGrabKey(this.rightHand));
          this.rightHand.addEventListener('gripup', () => this.tryReleaseKey(this.rightHand));
          this.rightHand.addEventListener('triggerdown', () => {
            this.rightTriggerDown = true;
            this.checkDualTriggers();
          });
          this.rightHand.addEventListener('triggerup', () => {
            this.rightTriggerDown = false;
          });
        },

        tryGrabKey: function (handEntity) {
          if (this.step !== 1 || this.keySolved || this.grabbedHand) return;

          const handPos = new THREE.Vector3();
          handEntity.object3D.getWorldPosition(handPos);

          const keyPos = new THREE.Vector3();
          this.keyEntity.object3D.getWorldPosition(keyPos);

          if (handPos.distanceTo(keyPos) < 0.28) {
            this.grabbedHand = handEntity;
            const scene = this.el.sceneEl.object3D;
            scene.attach(this.keyEntity.object3D);
            this.grabbedHand.object3D.attach(this.keyEntity.object3D);
            this.keyEntity.object3D.position.set(0, -0.04, -0.08);
            this.keyEntity.object3D.rotation.set(-Math.PI / 3, 0, 0);
          }
        },

        tryReleaseKey: function (handEntity) {
          if (this.grabbedHand !== handEntity || this.keySolved) return;

          const scene = this.el.sceneEl.object3D;
          scene.attach(this.keyEntity.object3D);
          this.grabbedHand = null;

          const keyPos = new THREE.Vector3();
          this.keyEntity.object3D.getWorldPosition(keyPos);

          const lockPos = new THREE.Vector3();
          this.lockEntity.object3D.getWorldPosition(lockPos);

          // If dropped near the keyhole
          if (keyPos.distanceTo(lockPos) < 0.25) {
            this.keySolved = true;
            this.keyEntity.object3D.position.set(0.35, 1.05, -0.63);
            this.keyEntity.object3D.rotation.set(0, 0, 0);

            SoundFX.playStepComplete();

            setTimeout(() => {
              this.step = 2;
              this.updateStep(false);
            }, 900);
          } else {
            // Snap back to pedestal
            this.keyEntity.object3D.position.copy(this.keyDefaultPos);
            this.keyEntity.object3D.rotation.set(0, 0, 0);
          }
        },

        checkDualTriggers: function () {
          if (this.step === 3 && this.leftTriggerDown && this.rightTriggerDown) {
            this.step = 4;
            this.updateStep(true);
          }
        },

        performTeleport: function () {
          const padPos = this.teleportZone.getAttribute('position');
          this.cameraRig.setAttribute('position', `${padPos.x} 0 ${padPos.z}`);

          if (this.teleportState === 'away') {
            SoundFX.playTargetHit();
            this.teleportState = 'home';
            this.teleportZone.setAttribute('position', '0 0.03 -0.6');
          } else if (this.teleportState === 'home') {
            this.step = 3;
            this.updateStep(true);
          }
        },

        tick: function (time, deltaTime) {
          // Teleport Aim & Ground Projection (Step 2.5)
          if (this.step === '2.5') {
            let stickPushed = false;
            let activeControllerEntity = this.rightHand;

            const xrSession = this.el.sceneEl.xrSession;
            if (xrSession && xrSession.inputSources) {
              for (const source of xrSession.inputSources) {
                if (source.gamepad && source.gamepad.axes) {
                  const axes = source.gamepad.axes;
                  const yAxis = axes.length >= 4 ? axes[3] : axes[1];

                  if (yAxis < -0.35) {
                    stickPushed = true;
                    activeControllerEntity = (source.handedness === 'left') ? this.leftHand : this.rightHand;
                    break;
                  }
                }
              }
            }

            if (stickPushed) {
              this.isStickActive = true;
              this.teleportBeam.setAttribute('visible', 'true');

              const handObj = activeControllerEntity.object3D;
              const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(handObj.quaternion);
              const handPos = new THREE.Vector3();
              handObj.getWorldPosition(handPos);

              if (forward.y < -0.05) {
                const t = -handPos.y / forward.y;
                const hitX = handPos.x + forward.x * t;
                const hitZ = handPos.z + forward.z * t;
                this.validTargetPos = { x: hitX, z: hitZ };

                this.teleportMarker.setAttribute('visible', 'true');
                this.teleportMarker.setAttribute('position', `${hitX} 0.03 ${hitZ}`);
                this.teleportBeam.setAttribute('line', {
                  start: `${handPos.x} ${handPos.y} ${handPos.z}`,
                  end: `${hitX} 0.03 ${hitZ}`,
                  color: '#00FFCC'
                });
              } else {
                this.validTargetPos = null;
                this.teleportMarker.setAttribute('visible', 'false');

                const endX = handPos.x + forward.x * 12;
                const endY = handPos.y + forward.y * 12;
                const endZ = handPos.z + forward.z * 12;

                this.teleportBeam.setAttribute('line', {
                  start: `${handPos.x} ${handPos.y} ${handPos.z}`,
                  end: `${endX} ${endY} ${endZ}`,
                  color: '#EEB111'
                });
              }
            } else {
              if (this.isStickActive) {
                this.isStickActive = false;
                this.teleportMarker.setAttribute('visible', 'false');
                this.teleportBeam.setAttribute('visible', 'false');

                if (this.validTargetPos) {
                  const padPos = this.teleportZone.getAttribute('position');
                  const dist = Math.hypot(this.validTargetPos.x - padPos.x, this.validTargetPos.z - padPos.z);
                  
                  if (dist < 1.8) {
                    this.performTeleport();
                  }
                  this.validTargetPos = null;
                }
              }
            }
          }
        },

        targetHit: function () {
          SoundFX.playTargetHit();
          this.targetsRemaining--;
          if (this.targetsRemaining <= 0) {
            this.step = '2.5';
            this.updateStep(true);
          }
        }
      });

      AFRAME.registerComponent('shootable', {
        init: function () {
          this.el.addEventListener('click', () => {
            this.el.setAttribute('animation', 'property: scale; to: 0 0 0; dur: 150');
            setTimeout(() => {
              const mgr = document.querySelector('a-scene').components['step-manager'];
              if (mgr) mgr.targetHit();
              this.el.parentNode.removeChild(this.el);
            }, 150);
          });
        }
      });

      function startLabExperience() {
        SoundFX.init();
        const overlay = document.querySelector('#launch-screen');
        if (overlay) overlay.style.display = 'none';
        document.querySelector('a-scene').enterVR();
      }
    </script>
  </head>
  <body>
    <div id="launch-screen" onclick="startLabExperience()">
      <div class="badge">KENT STATE UNIVERSITY</div>
      <h1>College of Nursing VR Lab</h1>
      <p>Controller Onboarding & Readiness Check (ver. 1.18) | Developed by John Comi</p>
      <div class="click-box">Push Any Button or Tap Screen to Begin</div>
    </div>

    <a-scene step-manager background="color: #001233">
      <a-light type="ambient" color="#FFF" intensity="1.0"></a-light>
      <a-light type="directional" position="0 6 -2" color="#FFF" intensity="0.6"></a-light>

      <!-- Floor & Station Indicator -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="18" height="18" color="#060E1A"></a-plane>
      <a-plane position="0 0.02 -0.6" rotation="-90 0 0" width="1.4" height="1.4" color="#0056B3" opacity="0.9"></a-plane>
      <a-ring position="0 0.03 -0.6" rotation="-90 0 0" radius-inner="0.65" radius-outer="0.7" color="#EEB111"></a-ring>
      <a-text value="STATION CENTER" position="0 0.04 -0.6" rotation="-90 0 0" align="center" width="2.4" color="#FFFFFF" font="roboto"></a-text>

      <!-- Camera Rig -->
      <a-entity id="camera-rig" position="0 0 0">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity id="left-hand" oculus-touch-controls="hand: left; model: true" laser-controls="hand: left" raycaster="lineColor: #EEB111; lineOpacity: 0.9"></a-entity>
        <a-entity id="right-hand" oculus-touch-controls="hand: right; model: true" laser-controls="hand: right" raycaster="lineColor: #EEB111; lineOpacity: 0.9"></a-entity>
      </a-entity>

      <!-- Step 1: Interactive Key & Lock Pedestals -->
      <a-entity id="key-lock-group" visible="true">
        <!-- Left Table / Pedestal for Key -->
        <a-cylinder position="-0.35 0.45 -0.7" radius="0.16" height="0.9" color="#00183F"></a-cylinder>
        <a-cylinder position="-0.35 0.91 -0.7" radius="0.18" height="0.03" color="#EEB111"></a-cylinder>

        <!-- Right Table / Pedestal for Lock -->
        <a-cylinder position="0.35 0.45 -0.7" radius="0.16" height="0.9" color="#00183F"></a-cylinder>
        <a-cylinder position="0.35 0.91 -0.7" radius="0.18" height="0.03" color="#EEB111"></a-cylinder>

        <!-- The Grabbable Key -->
        <a-entity id="key-entity" position="-0.35 1.05 -0.7">
          <a-torus radius="0.035" radius-tubular="0.008" color="#EEB111" metalness="0.8" roughness="0.2" rotation="0 90 0"></a-torus>
          <a-cylinder position="0 0 0.06" radius="0.007" height="0.09" color="#EEB111" metalness="0.8" roughness="0.2" rotation="90 0 0"></a-cylinder>
          <a-box position="0 -0.012 0.09" depth="0.02" width="0.007" height="0.016" color="#EEB111" metalness="0.8" roughness="0.2"></a-box>
        </a-entity>

        <!-- The Lock Block -->
        <a-entity id="lock-entity" position="0.35 1.05 -0.7">
          <a-box width="0.16" height="0.2" depth="0.12" color="#002664" roughness="0.3"></a-box>
          <!-- Keyhole Inset -->
          <a-box position="0 0 0.061" width="0.02" height="0.07" depth="0.01" color="#050505"></a-box>
        </a-entity>
      </a-entity>

      <!-- Dynamic Teleport Beam & Target Reticle -->
      <a-entity id="teleport-beam" visible="false" line="start: 0 0 0; end: 0 0 0; color: #00FFCC; opacity: 0.85"></a-entity>
      <a-entity id="teleport-marker" visible="false">
        <a-ring rotation="-90 0 0" radius-inner="0.25" radius-outer="0.32" color="#00FFCC"></a-ring>
        <a-circle rotation="-90 0 0" radius="0.25" color="#00FFCC" opacity="0.4"></a-circle>
      </a-entity>

      <!-- Designated Teleport Landing Pad -->
      <a-entity id="teleport-zone" visible="false" position="2.5 0.03 -1.5">
        <a-ring rotation="-90 0 0" radius-inner="0.5" radius-outer="0.65" color="#00FFCC" animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 800"></a-ring>
        <a-circle rotation="-90 0 0" radius="0.5" color="#002664" opacity="0.7"></a-circle>
        <a-text value="TELEPORT HERE" rotation="-90 0 0" position="0 0.01 0" align="center" width="2.6" color="#00FFCC" font="roboto"></a-text>
      </a-entity>

      <!-- Main Display Board -->
      <a-entity position="0 1.7 -4.5">
        <a-plane width="4.8" height="2.74" position="0 0 -0.01" color="#EEB111"></a-plane>
        <a-plane id="slideDisplay" position="0 0 0.01" width="4.76" height="2.68" material="shader: flat; color: #FFFFFF"></a-plane>
      </a-entity>

      <!-- 360 Targets -->
      <a-entity id="target-group" visible="false">
        <a-sphere class="clickable" shootable position="-3.2 1.6 0.0" radius="0.26" color="#EEB111" animation="property: position; to: -3.2 1.75 0.0; dir: alternate; loop: true; dur: 1200"></a-sphere>
        <a-sphere class="clickable" shootable position="3.2 1.6 0.0" radius="0.26" color="#EEB111" animation="property: position; to: 3.2 1.75 0.0; dir: alternate; loop: true; dur: 1400"></a-sphere>
        <a-sphere class="clickable" shootable position="0.0 1.7 3.0" radius="0.26" color="#EEB111" animation="property: position; to: 0.0 1.85 3.0; dir: alternate; loop: true; dur: 1000"></a-sphere>
      </a-entity>
    </a-scene>
  </body>
</html>
