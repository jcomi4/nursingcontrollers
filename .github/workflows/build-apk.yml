name: Build Meta Quest WebXR APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Meta Bubblewrap
        run: npm install -g @meta-quest/bubblewrap-cli

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass ksunursing -keypass ksunursing \
          -dname "CN=KSU, OU=Nursing, O=Kent State University, L=Kent, S=OH, C=US"

      - name: Create Quest TWA Manifest
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "edu.kent.nursing.controllers",
            "host": "jcomi4.github.io",
            "name": "KSU Nursing VR Orientation",
            "launcherName": "KSU Orient",
            "themeColor": "#EEB111",
            "navigationColor": "#002664",
            "backgroundColor": "#002664",
            "enableNotifications": false,
            "startUrl": "/nursingcontrollers/index.html",
            "iconUrl": "https://jcomi4.github.io/nursingcontrollers/slide1.png",
            "maskableIconUrl": "https://jcomi4.github.io/nursingcontrollers/slide1.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://jcomi4.github.io/nursingcontrollers/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": { "enabled": false },
              "playBilling": { "enabled": false }
            },
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": false,
            "isChromeOSOnly": false,
            "isMetaQuest": true,
            "display": "immersive"
          }
          EOF

      - name: Build Signed APK
        run: |
          bubblewrap build \
            --manifest=twa-manifest.json \
            --keyStorePath=android.keystore \
            --keyStorePassword=ksunursing \
            --keyPassword=ksunursing

      - name: Calculate SHA256 Hash
        id: hash
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          cp "$APK_FILE" app-release-signed.apk
          HASH=$(sha256sum app-release-signed.apk | awk '{print $1}')
          echo "SHA256=$HASH" >> $GITHUB_ENV
          echo "========================================================"
          echo "YOUR SHA256 HASH IS: $HASH"
          echo "========================================================"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "KSU Orientation Release v1.0.0"
          body: "SHA256 Hash: ${{ env.SHA256 }}"
          files: app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
