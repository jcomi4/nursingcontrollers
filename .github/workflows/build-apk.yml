name: Build Meta Quest WebXR APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Native Quest WebView App
        run: |
          mkdir -p app/src/main/java/edu/kent/nursing/controllers
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Icon
          curl -s -L "https://jcomi4.github.io/nursingcontrollers/slide1.png" -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # App Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">KSU Nursing VR Orientation</string>
          </resources>
          EOF

          # Fullscreen layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#002664">
              <WebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          # Standard Android Manifest without blocking VR tags
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity with hardware acceleration & WebGL/WebXR settings
          cat << 'EOF' > app/src/main/java/edu/kent/nursing/controllers/MainActivity.java
          package edu.kent.nursing.controllers;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("https://jcomi4.github.io/nursingcontrollers/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "include ':app'" > settings.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'edu.kent.nursing.controllers'
              compileSdk 34

              defaultConfig {
                  applicationId "edu.kent.nursing.controllers"
                  minSdk 29
                  targetSdk 34
                  versionCode 2
                  versionName "1.0.1"
              }

              signingConfigs {
                  release {
                      storeFile file("../android.keystore")
                      storePassword "ksunursing"
                      keyAlias "android"
                      keyPassword "ksunursing"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass ksunursing -keypass ksunursing \
          -dname "CN=KSU, OU=Nursing, O=Kent State University, L=Kent, S=OH, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed APK with Gradle
        run: gradle assembleRelease
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Calculate SHA256 Hash
        id: hash
        run: |
          cp app/build/outputs/apk/release/app-release.apk ./app-release-signed.apk
          HASH=$(sha256sum app-release-signed.apk | awk '{print $1}')
          echo "SHA256=$HASH" >> $GITHUB_ENV
          echo "========================================================"
          echo "YOUR SHA256 HASH IS: $HASH"
          echo "========================================================"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "KSU Orientation Release v1.0.1"
          body: "SHA256 Hash: ${{ env.SHA256 }}"
          files: app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
