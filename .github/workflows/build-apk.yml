name: Build Meta Quest WebXR APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Meta Bubblewrap
        run: npm install -g @meta-quest/bubblewrap-cli

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass ksunursing -keypass ksunursing \
          -dname "CN=KSU, OU=Nursing, O=Kent State University, L=Kent, S=OH, C=US"

      - name: Initialize Meta Quest Project
        run: |
          bubblewrap init --manifest=https://jcomi4.github.io/nursingcontrollers/manifest.webmanifest \
          --metaquest --mode=immersive

      - name: Build Signed APK
        run: |
          bubblewrap build --keyStorePath=android.keystore \
          --keyStorePassword=ksunursing --keyPassword=ksunursing

      - name: Calculate SHA256 Hash
        id: hash
        run: |
          APK_FILE=$(find . -name "*signed*.apk" | head -n 1)
          cp "$APK_FILE" app-release-signed.apk
          HASH=$(sha256sum app-release-signed.apk | awk '{print $1}')
          echo "SHA256=$HASH" >> $GITHUB_ENV
          echo "========================================================"
          echo "YOUR SHA256 HASH IS: $HASH"
          echo "========================================================"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "KSU Orientation Release v1.0.0"
          body: "SHA256 Hash: ${{ env.SHA256 }}"
          files: app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
